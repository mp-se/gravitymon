name: Build CI

on:
  pull_request:
  push:
    branches:
      - dev

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VITE_APP_REGISTER_APIKEY: ${{ secrets.REGISTER_APIKEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build UI version info
        working-directory: ui
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --tags
          REV=`git rev-parse HEAD | rev | cut -c 1-6 | rev`
          TAG=`git tag --sort=creatordate | tail -1`
          echo "VITE_APP_BUILD=..$REV" >> .env
          echo "VITE_APP_VERSION=$TAG" >> .env
          cat .env

      - name: Build UI
        working-directory: ui
        run: |
          rm -rf node_modules package-lock.json
          npm install
          npm run build

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          # intelhex is required by PlatformIO but missing from its dependencies
          pip install platformio intelhex

      - name: PlatformIO Run 1/2
        run: pio run -e gravity-8266 -e gravity-32c3_mini -e gravity-32s3_mini -e gravity-32s2_mini -e gravity-32c3_zero -e gravity-32s3_zero -j 1 -v

      - name: PlatformIO Run 2/2
        run: pio run -e gravity-32c3_supermini -e gravity-32c3_cuckoo -e gravity-32c3_cuckoo_v2 -e gravity-olimex_esp32c3_devkit_lipo -j 1 -v

      # Pull requests only verify that the build works, nothing is committed
      - uses: EndBug/add-and-commit@v11
        if: github.event_name == 'push'
        with:
          add: 'bin html'
          author_name: GitHub Action
          author_email: mp-se@noreply.github.com
          default_author: github_actor
          message: 'GitHub Action Build'
          pathspec_error_handling: ignore
